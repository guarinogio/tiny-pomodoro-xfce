repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check
        language: system
        types: [python]

      - id: python-compile
        name: python compile
        entry: python3 -m py_compile
        language: system
        files: '^tiny_pomodoro/.*\.py$|^tiny_pomodoro\.py$'
