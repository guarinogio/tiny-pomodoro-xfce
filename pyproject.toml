[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-pomodoro-xfce"
version = "0.2.0"
description = "Small floating Pomodoro and countdown timer for Xubuntu/XFCE"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Gio Guarino" }
]
keywords = ["pomodoro", "xfce", "xubuntu", "timer", "gtk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: GTK",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities"
]

[project.scripts]
tiny-pomodoro = "tiny_pomodoro.cli:main"

[tool.setuptools]
packages = ["tiny_pomodoro"]
