name: Publish APT Repository

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-apt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          path: project

      - name: Checkout APT repository
        uses: actions/checkout@v4
        with:
          repository: guarinogio/tiny-pomodoro-xfce-apt
          token: ${{ secrets.APT_REPO_TOKEN }}
          path: apt-repo

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential devscripts debhelper dh-python python3-all \
            pybuild-plugin-pyproject python3-setuptools \
            desktop-file-utils dpkg-dev apt-utils gnupg

      - name: Import GPG key
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "${{ secrets.APT_GPG_PRIVATE_KEY }}" | gpg --batch --import
          gpg --list-secret-keys --keyid-format=long

      - name: Build Debian package
        working-directory: project
        run: |
          rm -rf build dist *.egg-info .pybuild debian/tiny-pomodoro-xfce debian/.debhelper debian/debhelper-build-stamp
          dpkg-buildpackage -us -uc -b

      - name: Publish package into APT repo
        run: |
          set -euo pipefail

          DEB="$(ls -1 tiny-pomodoro-xfce_*.deb | head -n1)"

          cd apt-repo

          mkdir -p pool/main/t/tiny-pomodoro-xfce
          mkdir -p dists/stable/main/binary-all

          rm -f pool/main/t/tiny-pomodoro-xfce/*.deb
          cp "../$DEB" pool/main/t/tiny-pomodoro-xfce/

          gpg --armor --export "${{ secrets.APT_GPG_KEY_ID }}" > public.key

          dpkg-scanpackages --arch all pool > dists/stable/main/binary-all/Packages
          gzip -k -f dists/stable/main/binary-all/Packages

          cat > dists/stable/Release <<'EOF'
          Origin: Tiny Pomodoro XFCE
          Label: Tiny Pomodoro XFCE
          Suite: stable
          Codename: stable
          Architectures: all
          Components: main
          Description: APT repository for Tiny Pomodoro XFCE
          EOF

          apt-ftparchive release dists/stable >> dists/stable/Release

          gpg --default-key "${{ secrets.APT_GPG_KEY_ID }}" --batch --yes --armor \
            --detach-sign \
            -o dists/stable/Release.gpg \
            dists/stable/Release

          gpg --default-key "${{ secrets.APT_GPG_KEY_ID }}" --batch --yes --clearsign \
            -o dists/stable/InRelease \
            dists/stable/Release

      - name: Commit and push APT repo
        working-directory: apt-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Publish ${GITHUB_REF_NAME}" || exit 0
          git push

      - name: Upload .deb to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.deb"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
